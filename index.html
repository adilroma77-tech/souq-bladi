<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوق بلادي</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#fefce8}.h{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:22px;color:#15803d}.logo b{color:#dc2626}.btn{background:#f97316;color:#fff;border:none;padding:10px 20px;border-radius:99px;font-weight:800;cursor:pointer}.hero{background:#15803d;color:#fff;padding:36px 20px;text-align:center}.hero h1{font-size:30px}.hero p{margin-top:8px;opacity:.9}.tags{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tag{background:#ffffff26;padding:6px 12px;border-radius:99px;font-size:12px}.box{background:#fff;margin:-20px 16px 16px;padding:14px;border-radius:16px;box-shadow:0 8px 30px #0002}.box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;text-align:right}.grid{padding:0 16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.c{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px #0001;cursor:pointer;transition:.2s;border:1px solid #f3f4f6}.c:active{transform:scale(.96)}.c .im{height:80px;border-radius:12px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:38px}.c h3{font-size:13px;margin:10px 0 4px}.pr{color:#15803d;font-weight:900}.ct{font-size:11px;color:#888}.foot{text-align:center;padding:24px;color:#888;font-size:11px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:99;padding:16px}.modal .m{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:380px;text-align:center;animation:pop .2s}.modal .m h2{font-size:20px}.modal .m p{margin:8px 0;color:#555}.modal .m .big{font-size:50px;margin:10px 0}.close{margin-top:14px;background:#111;color:#fff;border:none;padding:12px 20px;border-radius:12px;width:100%;font-weight:700}.wa{background:#25D366;color:#fff;border:none;padding:12px 20px;border-radius:12px;width:100%;font-weight:700;margin-top:8px}.sell input,.sell textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-top:8px;text-align:right}@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}</style></head><body><div class="h"><div class="logo">سوق<b>س</b> بلادي</div><button class="btn" onclick="openSell()">بيع +</button></div><div class="hero"><h1>بيع وشري أي حاجة فبلادك</h1><p>منصة مغربية 100% - كلشي حداك</p><div class="tags"><div class="tag">+50 ألف إعلان</div><div class="tag">دفع آمن</div><div class="tag">موثوقون</div></div></div><div class="box"><input placeholder="شنو باغي تقلب؟"></div><div class="grid"><div class="c" onclick="openCard('Renault Clio 2020','85,000 درهم','مراكش - 120,000 كم - مازوط')"><div class="im">🚗</div><h3>Renault Clio 2020</h3><div class="pr">85,000 درهم</div><div class="ct">📍 مراكش</div></div><div class="c" onclick="openCard('iPhone 14 Pro 256GB','9,200 درهم','كازا - باقي جديد مع الباطة')"><div class="im">📱</div><h3>iPhone 14 Pro</h3><div class="pr">9,200 درهم</div><div class="ct">📍 كازا</div></div><div class="c" onclick="openCard('شقة 90م - الرباط','650,000 درهم','الرباط - الطابق 2 - 3 بيوت')"><div class="im">🏠</div><h3>شقة 90م</h3><div class="pr">650,000 درهم</div><div class="ct">📍 الرباط</div></div><div class="c" onclick="openCard('Nike Air Max - جديد','450 درهم','فاس - نمرة 42 - أصلي')"><div class="im">👟</div><h3>Nike Air Max</h3><div class="pr">450 درهم</div><div class="ct">📍 فاس</div></div></div><div class="foot">سوق بلادي © 2026</div><div id="modal" class="modal" onclick="closeM()"><div class="m" onclick="event.stopPropagation()"><div class="big" id="mi">🚗</div><h2 id="mt">عنوان</h2><p id="mp" class="pr" style="font-size:18px"></p><p id="mc"></p><button class="wa" onclick="alert('سيتم فتح واتساب البائع قريبا')">تواصل واتساب 📲</button><button class="close" onclick="closeM()">إغلاق</button></div></div><div id="sell" class="modal" onclick="closeM()"><div class="m sell" onclick="event.stopPropagation()"><h2>حط إعلانك +</h2><input placeholder="شنو بغيتي تبيع؟"><input placeholder="الثمن بالدرهم"><input placeholder="المدينة"><textarea placeholder="الوصف..." rows="3"></textarea><button class="wa" onclick="alert('تم نشر إعلانك بنجاح! (تجريبي)');closeM()">نشر الإعلان ✅</button><button class="close" onclick="closeM()">إلغاء</button></div></div><script>function openCard(t,p,c){document.getElementById('mt').innerText=t;document.getElementById('mp').innerText=p;document.getElementById('mc').innerText=c;document.getElementById('modal').style.display='flex';var e='🏠';if(t.includes('Renault')||t.includes('Clio'))e='🚗';else if(t.includes('iPhone')||t.includes('Phone'))e='📱';else if(t.includes('Nike'))e='👟';document.getElementById('mi').innerText=e}function closeM(){document.getElementById('modal').style.display='none';document.getElementById('sell').style.display='none'}function openSell(){document.getElementById('sell').style.display='flex'}</script></body></html>
